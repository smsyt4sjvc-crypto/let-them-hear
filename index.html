<title>Email Your Legislators</title>
<meta name="description" content="A convenient link to email your Washington State legislators.">
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;700&display=swap');
  :root { --ink: #1a1a1a; --paper: #f5f1eb; --red: #8b1a1a; --red-light: #a52a2a; --border: #c9c1b4; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh;
         display: flex; align-items: center; justify-content: center; padding: 2rem 1rem; }
  .card { max-width: 560px; width: 100%; text-align: center; }
  h1 { font-family: 'DM Serif Display', serif; font-size: 2.2rem; font-weight: 400; margin-bottom: 0.75rem; }
  p { font-size: 1.1rem; margin-bottom: 1.75rem; }
  .btn { display: inline-block; background: var(--red); color: #fff; text-decoration: none; font-weight: 700;
         font-size: 1.15rem; padding: 1rem 2rem; border-radius: 8px; }
  .btn:hover { background: var(--red-light); }
  .copy { display: block; margin: 1.5rem auto 0; background: none; border: none; color: var(--ink);
          text-decoration: underline; font: inherit; font-size: 0.95rem; cursor: pointer; }
</style>
</head>

<main class="card">
  <h1>Email Your Legislators</h1>
  <p>Here&rsquo;s a convenient link to email your legislators.</p>
  <a class="btn" id="mailtoLink" href="#">&#9993;&ensp;Email Legislators</a>
